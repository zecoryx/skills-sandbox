services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: sandbox
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    command: npm run dev
    environment:
      DATABASE_URL: postgres://sandbox:sandbox@db:5432/sandbox
      API_KEY: sandbox-key
      APP_VERSION: dev
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./scripts:/app/scripts
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
